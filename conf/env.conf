# env.conf file - DO NOT EDIT!
# This is the default environment needed for the wrapper to work 

# HTTP port ramalama serves the OpenAI-compatible API on.
export MODEL_PORT="8080"
# Host port mapped to pi-agent's RPC port.
export PI_RPC_PORT="50051"

# Max seconds to wait for ramalama's /v1/models before treating startup as failed.
export RAMALAMA_HEALTHCHECK_TIMEOUT=60

# Model auto-started by --start-rpc (non-interactive RPC bootstrap for VSCode);
# must already be pulled locally.
export DEFAULT_RPC_MODEL=""

# Directory containing the 'ramalama' binary, only needed if the process
# invoking pi-ramalama doesn't inherit your shell's PATH (e.g. VSCode spawning
# the pi wrapper). Leave empty to rely on PATH as usual.
export RAMALAMA_BIN_DIR=""

source "$(dirname "${BASH_SOURCE[0]}")/user.env.conf"
